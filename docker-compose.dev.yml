# Development database only (the app runs with `bun run dev`).
# bun run db:up / bun run db:down
# Own project name so this never collides with the production stack in docker-compose.yml.
name: immich-sync-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: immich_sync
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: immich_sync
    ports:
      - "127.0.0.1:55432:5432" # not 5432: that port is commonly taken by other local PostgreSQL containers
    volumes:
      - immich-sync-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich_sync -d immich_sync"]
      interval: 5s
      retries: 10

volumes:
  immich-sync-dev-db:
