name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: immich_sync
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: immich_sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U immich_sync -d immich_sync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the database-gated integration tests.
      TEST_DATABASE_URL: postgres://immich_sync:ci-only-password@localhost:5432/immich_sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2 # keep in sync with the Dockerfile
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test
