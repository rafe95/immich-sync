# Immich Sync: the app plus its PostgreSQL database.
# 1. cp .env.example .env and fill in the three secrets
# 2. docker compose up -d --build
# 3. open http://localhost:8080
services:
  app:
    build: .
    # To run the published image instead of building locally, replace the two lines below with
    #   image: ghcr.io/rafe95/immich-sync:<tag>   (e.g. 0.1.0; see "Releases" in README.md)
    # and start with `docker compose up -d` (use `pull` to update). Keep `build: .` to build from source.
    image: immich-sync:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080" # localhost only; see README before exposing it
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      DATABASE_URL: postgres://immich_sync:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/immich_sync
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env} # encrypts stored API keys
      TRUST_PROXY: ${TRUST_PROXY:-false} # true only behind your own reverse proxy: login limits then use X-Forwarded-For

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: immich_sync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: immich_sync
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich_sync -d immich_sync"]
      interval: 5s
      timeout: 5s
      retries: 10
